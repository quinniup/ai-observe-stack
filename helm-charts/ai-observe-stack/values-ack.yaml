# =============================================================================
# AIObserve Stack - Alibaba Cloud ACK Recommended Values
# =============================================================================
# Enables node-level container stdout/stderr log collection through a DaemonSet.
# The main OTel Collector StatefulSet remains the central gateway and Doris writer.

logCollector:
  enabled: true
  mode: containerStdout

  hostPaths:
    containers: /var/log/containers
    pods: /var/log/pods

  storage:
    enabled: true
    path: /var/lib/otelcol/file_storage

  filelog:
    include:
      - /var/log/containers/*.log
    exclude: []
    startAt: end
    pollInterval: 1s
    fingerprintSize: 1kb
    maxLogSize: 1MiB
    maxConcurrentFiles: 1024
    includeFilePathResolved: true
    includeFileNameResolved: true
    retryOnFailure:
      enabled: true
      initialInterval: 1s
      maxInterval: 30s
      maxElapsedTime: 0

  export:
    otlp:
      endpoint: ""
