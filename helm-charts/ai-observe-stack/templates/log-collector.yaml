{{/*
Node-level OpenTelemetry log collector for Kubernetes/ACK container stdout logs.
*/}}
{{- if .Values.logCollector.enabled }}
{{- if ne .Values.logCollector.mode "containerStdout" }}
{{- fail "logCollector.mode currently supports only 'containerStdout'" }}
{{- end }}
{{- $endpoint := .Values.logCollector.export.otlp.endpoint | default (printf "%s:%v" (include "aiobs.otel.fullname" .) .Values.otel.ports.otlpGrpc) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aiobs.logCollector.fullname" . }}-config
  labels:
    {{- include "aiobs.labels" . | nindent 4 }}
    app.kubernetes.io/component: log-collector
data:
  config.yaml: |
    receivers:
      filelog/container:
        include:
{{ toYaml .Values.logCollector.filelog.include | nindent 10 }}
        {{ with .Values.logCollector.filelog.exclude }}
        exclude:
{{ toYaml . | nindent 10 }}
        {{ end }}
        start_at: {{ .Values.logCollector.filelog.startAt }}
        include_file_path: true
        include_file_name: true
        {{ if .Values.logCollector.storage.enabled }}
        storage: file_storage
        {{ end }}
        operators:
          - type: container

    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 256
        spike_limit_mib: 64
      resource:
        attributes:
          - key: collector.mode
            value: daemonset
            action: upsert
          - key: collector.source
            value: container-stdout
            action: upsert
      batch:
        timeout: 5s
        send_batch_size: 1024

    exporters:
      otlp:
        endpoint: {{ $endpoint | quote }}
        tls:
          insecure: true

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      {{ if .Values.logCollector.storage.enabled }}
      file_storage:
        directory: {{ .Values.logCollector.storage.path | quote }}
      {{ end }}

    service:
      extensions:
        - health_check
        {{ if .Values.logCollector.storage.enabled }}
        - file_storage
        {{ end }}
      pipelines:
        logs:
          receivers: [filelog/container]
          processors: [memory_limiter, resource, batch]
          exporters: [otlp]

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "aiobs.logCollector.fullname" . }}
  labels:
    {{- include "aiobs.labels" . | nindent 4 }}
    app.kubernetes.io/component: log-collector
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "aiobs.name" . }}-log-collector
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "aiobs.name" . }}-log-collector
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/config: {{ toYaml .Values.logCollector | sha256sum }}
    spec:
      containers:
        - name: log-collector
          image: "{{ .Values.logCollector.image.repository }}:{{ .Values.logCollector.image.tag }}"
          imagePullPolicy: {{ .Values.logCollector.image.pullPolicy }}
          command:
            - /otelcol-contrib
            - --config=/etc/otelcol/config.yaml
          ports:
            - name: health-check
              containerPort: 13133
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: health-check
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: health-check
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.logCollector.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
              readOnly: true
            - name: varlog-containers
              mountPath: {{ .Values.logCollector.hostPaths.containers }}
              readOnly: true
            - name: varlog-pods
              mountPath: {{ .Values.logCollector.hostPaths.pods }}
              readOnly: true
            {{- if .Values.logCollector.storage.enabled }}
            - name: file-storage
              mountPath: {{ .Values.logCollector.storage.path }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "aiobs.logCollector.fullname" . }}-config
        - name: varlog-containers
          hostPath:
            path: {{ .Values.logCollector.hostPaths.containers }}
            type: Directory
        - name: varlog-pods
          hostPath:
            path: {{ .Values.logCollector.hostPaths.pods }}
            type: Directory
        {{- if .Values.logCollector.storage.enabled }}
        - name: file-storage
          hostPath:
            path: {{ .Values.logCollector.storage.path }}
            type: DirectoryOrCreate
        {{- end }}
{{- end }}
